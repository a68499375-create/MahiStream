<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14141F"/>
      <stop offset="100%" stop-color="#0A0A0F"/>
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>

    <linearGradient id="wingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE699"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <!-- Base Badge -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  
  <!-- Outer Glow Ring -->
  <rect x="12" y="12" width="488" height="488" rx="116" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-opacity="0.35"/>

  <!-- Halo Curve at Top -->
  <path d="M 160 140 Q 256 100 352 140 Q 256 120 160 140 Z" fill="url(#goldGrad)"/>

  <!-- Emblem M Wings & Play Button -->
  <!-- Left Wing -->
  <path d="M 120 370 L 120 200 C 120 170, 160 170, 180 195 L 256 280 L 185 370 Z" fill="url(#goldGrad)"/>
  
  <!-- Right Wing -->
  <path d="M 392 370 L 392 200 C 392 170, 352 170, 332 195 L 256 280 L 327 370 Z" fill="url(#wingGrad)"/>

  <!-- Center Play Ribbon -->
  <path d="M 226 210 L 316 266 L 226 322 Z" fill="#FFFFFF"/>
</svg>
