<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#c68a4e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MahiStream" />

    <!-- SEO Meta Tags -->
    <title>MahiStream — Nonton Anime Subtitle Indonesia</title>
    <meta name="description" content="MahiStream adalah platform streaming anime terlengkap dengan subtitle Indonesia. Nonton anime online gratis, update jadwal tayang, dan kelola koleksi favoritmu." />
    <meta name="keywords" content="nonton anime, anime subtitle indonesia, streaming anime, anime online, jadwal anime, MahiStream" />
    <meta name="author" content="MahiStream" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="MahiStream — Nonton Anime Subtitle Indonesia" />
    <meta property="og:description" content="Platform streaming anime terlengkap dengan subtitle Indonesia. Update harian, jadwal tayang, dan fitur bookmark." />
    <meta property="og:locale" content="id_ID" />
    <meta property="og:site_name" content="MahiStream" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MahiStream — Nonton Anime Subtitle Indonesia" />

    <!-- Preconnect + Preload fonts agar font siap sebelum React render -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Bebas+Neue&family=Poppins:wght@400;500;600;700&display=swap">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Bebas+Neue&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Inline critical CSS: spinner + bg agar tidak ada layar putih -->
    <style>
      body { margin: 0; background: #fdf8f1; }
      #root:empty {
        display: flex; align-items: center; justify-content: center;
        min-height: 100vh; min-height: 100dvh;
      }
      #root:empty::after {
        content: ''; width: 36px; height: 36px;
        border: 4px solid #c68a4e; border-top-color: transparent;
        border-radius: 50%;
        animation: _spin .6s linear infinite;
      }
      @keyframes _spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
